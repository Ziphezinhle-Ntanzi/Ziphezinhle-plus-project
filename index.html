<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="body">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter city...."
            id="search-form-input"
          />
          <input type="submit" value="Search" id="search-form-button" />
        </form>
      </header>
      <div class="weather-data">
        <h1 class="city">Pretoria</h1>
        <div class="weather-details">
          <p>
            Saturday 23:05, mostly clear <br />
            Humidity: <strong>77 %</strong>, Wind: <strong>16 km/h</strong>
          </p>
        </div>
        <div class="temperature-data">
          <div class="temperature-emoji">☀️</div>
          <div class="current-temperature">14</div>
          <div class="temperature-metric"><strong>°C</strong></div>
        </div>
      </div>
      <footer>
        This is coded by
        <a href="https://github.com/Ziphezinhle-Ntanzi" target="_blank"
          >Ziphezinhle Ntanzi</a
        >, open sourced on
        <a
          href="https://github.com/Ziphezinhle-Ntanzi/Ziphezinhle-plus-project"
          target="_blank"
          >Github</a
        >
        and hosted on
        <a href="https://ziphezinhle-plus-project.netlify.app/" target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
  </body>
</html>
